# Site checks. Nothing here touches the published site — GitHub Pages deploys
# from main independently of this workflow.
#
# What each check protects is documented in _tools/checks/*.mjs. Run the same
# checks locally with:  cd _tools && npm ci && npm run check
name: checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _tools/package-lock.json

      - name: Install dev tooling
        working-directory: _tools
        run: npm ci

      # Only Chromium. The contrast check renders each page to measure what the
      # browser actually computed; a static CSS reading of it produced ~90%
      # false positives. The browser itself comes from Playwright's download
      # host, not apt, so an unreachable Ubuntu mirror can't stop it.
      - name: Install Chromium
        working-directory: _tools
        run: npx playwright install chromium

      # The system libraries Chromium needs, from apt. ubuntu-latest already
      # carries them, so this is a top-up: it refreshes apt and retries three
      # times, then warns instead of failing if the mirror stays unreachable.
      # If a library really is missing, the self-test and the contrast check
      # below fail loudly, which is the outcome we want.
      - name: Install Chromium system libraries
        working-directory: _tools
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && npx playwright install-deps chromium; then
              exit 0
            fi
            echo "apt attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::warning::Could not install Chromium's system libraries from apt after 3 attempts; continuing with the runner's preinstalled ones."

      # Proves each check still fires on a known defect before trusting a
      # green run. A check that never fires reports green and is believed.
      - name: Self-test the checks
        working-directory: _tools
        run: node selftest.mjs

      - name: Run site checks
        run: node _tools/check.mjs
